# Shared fragments. Buildkite expands YAML anchors / merge keys at upload.
x-branch-if: &branch-if
  if: |
    build.branch == "master" || build.branch == "main" ||
    build.branch =~ /^cursor\// ||
    build.pull_request.base_branch == "master" ||
    build.pull_request.base_branch == "main"

steps:
  - group: ":mac: mac-mini-macos CI"
    key: mac-mini-macos-ci
    <<: *branch-if
    steps:
      - label: ":package: build darwin + aarch64-linux packages"
        key: build-packages-mac-mini-macos
        command: .buildkite/scripts/build-packages.sh aarch64-darwin aarch64-linux
        agents:
          queue: mac-mini-macos
        timeout_in_minutes: 240
        priority: 10
