# Shared fragments. Buildkite expands YAML anchors / merge keys at upload.
x-branch-if: &branch-if
  if: |
    build.branch == "master" || build.branch == "main" ||
    build.branch =~ /^cursor\// ||
    build.pull_request.base_branch == "master" ||
    build.pull_request.base_branch == "main"

steps:
  - group: ":mac: mac-mini-macos CI"
    key: mac-mini-macos-ci
    <<: *branch-if
    steps:
      # Discrete steps, both on mac-mini-macos. Linux depends on Darwin so
      # they do not race for one free slot while t-hex holds the other
      # (Darwin would sit scheduled). 480m covers linux-builder upload lock.
      - label: ":apple: build aarch64-darwin packages"
        key: build-packages-aarch64-darwin
        command: .buildkite/scripts/build-packages.sh aarch64-darwin
        agents:
          queue: mac-mini-macos
        timeout_in_minutes: 120
        priority: 10
      - label: ":penguin: build aarch64-linux packages"
        key: build-packages-aarch64-linux
        command: .buildkite/scripts/build-packages.sh aarch64-linux
        agents:
          queue: mac-mini-macos
        timeout_in_minutes: 480
        priority: 10
        depends_on: build-packages-aarch64-darwin
